name: Agente Buscador de Licitaciones

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}

jobs:
  ejecutar_agente:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai beautifulsoup4 pandas openpyxl lxml python-dotenv schedule
          # Busca e instala automáticamente cualquier archivo de requisitos
          REQ=$(find . -iname "*req*.txt" -o -iname "*req*.TXT" | head -n 1)
          if [ -n "$REQ" ]; then pip install -r "$REQ"; fi

      - name: Ejecutar agente de Python
        env:
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          # Busca en todo el repositorio cualquier archivo python que contenga "buscador"
          SCRIPT=$(find . -iname "*buscador*.py" | head -n 1)
          
          if [ -n "$SCRIPT" ]; then
            echo "¡Archivo encontrado! Ejecutando: $SCRIPT"
            python -u "$SCRIPT"
          else
            echo "Error: No se encontró ningún archivo de Python. Archivos actuales:"
            ls -R
            exit 1
          fi
